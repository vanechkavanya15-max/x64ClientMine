[package]
name = "m2-client-bridge"
version = "0.1.0"
edition = "2021"
description = "Metin2 Client Rust FFI Bridge for incremental migration (Phase A)"

[lib]
name = "m2_client_bridge"
crate-type = ["rlib"]

[dependencies]
once_cell = "1.19"
crossbeam-channel = "0.5"
lzo = "0.1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true




