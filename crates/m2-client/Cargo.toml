[package]
name = "m2-client"
version = "0.2.0"
edition = "2021"
description = "Metin2 64-bit Game Engine Core (Phase B)"

[lib]
name = "m2_client"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib", "staticlib"]

[[bin]]
name = "m2_client"
path = "src/bin/m2_client.rs"

[dependencies]
m2_client_bridge = { package = "m2-client-bridge", path = "../../rust_bridge" }
glam = "0.29"
once_cell = "1.20"
lazy_static = "1.5"
chacha20 = { version = "0.10.2", features = ["xchacha"] }
zstd = "0.14.0"
wgpu = "30.0.1"
raw-window-handle = "0.6.2"
pollster = "1.0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tga"] }
bytemuck = { version = "1.20", features = ["derive"] }
pyo3 = { version = "0.23", default-features = false, features = ["auto-initialize"] }
rodio = "0.20"

[dev-dependencies]
serial_test = "3.2"


